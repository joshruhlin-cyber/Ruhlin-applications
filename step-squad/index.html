<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Step Squad" />
<meta name="theme-color" content="#0b1020" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>" />
<title>Step Squad</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1020;
    --bg-2: #111a33;
    --panel: #141c33;
    --ink: #eef2ff;
    --muted: #8d97b5;
    --border: #243052;
    --accent: #a3e635;
    --accent-ink: #1a2e05;
    --accent-2: #22d3ee;
    --gold: #fbbf24;
    --coral: #fb7185;
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 65%) fixed;
    background-color: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input { font: inherit; }
  b { font-weight: 700; }

  /* ── header ── */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .brand { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.5px; }
  .brand span { color: var(--accent); }
  .avatar-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 1.3rem; display: grid; place-items: center;
  }
  .demo-banner {
    font-size: 0.82rem; color: var(--accent-ink); background: var(--accent);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; font-weight: 600;
  }
  .demo-banner a { color: inherit; }

  /* ── panels ── */
  .panel {
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .panel-head h2 { font-size: 1.05rem; font-weight: 750; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); }
  .small { font-size: 0.82rem; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 16px; border-radius: 12px; font-weight: 650; font-size: 0.92rem;
    background: var(--panel); border: 1px solid var(--border);
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  a.btn { text-decoration: none; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--coral); }
  .btn.sm { padding: 6px 11px; font-size: 0.82rem; border-radius: 10px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.5; }

  /* ── my ring ── */
  .me-card { display: flex; gap: 18px; align-items: center; }
  .ring-wrap { position: relative; width: 132px; height: 132px; flex: none; }
  .ring { width: 100%; height: 100%; }
  .ring circle { fill: none; stroke-width: 11; }
  .ring .track { stroke: rgba(255,255,255,0.08); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
  .ring.done .bar { stroke: var(--gold); }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-center .num { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.5px; }
  .ring-center .of { font-size: 0.75rem; color: var(--muted); }
  .me-info { min-width: 0; flex: 1; }
  .me-info .hello { font-size: 0.85rem; color: var(--muted); }
  .me-info .pep { font-size: 1.05rem; font-weight: 700; margin: 4px 0 6px; line-height: 1.3; }
  .me-info .meta { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
  .streak { color: var(--gold); font-weight: 700; }
  .me-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* ── group chips ── */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 14px; border-radius: 999px; font-size: 0.88rem; font-weight: 650;
    background: var(--panel); border: 1px solid var(--border); white-space: nowrap;
  }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.add { color: var(--accent); border-style: dashed; }

  /* ── leaderboard ── */
  .seg { display: inline-flex; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 3px; }
  .seg button { padding: 5px 11px; border-radius: 8px; font-size: 0.8rem; font-weight: 650; color: var(--muted); }
  .seg button.on { background: var(--panel); color: var(--ink); }
  .board { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 12px; }
  .row.me { background: rgba(163,230,53,0.07); }
  .rank { width: 22px; text-align: center; font-weight: 700; color: var(--muted); font-size: 0.9rem; flex: none; }
  .av { width: 38px; height: 38px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); display: grid; place-items: center; font-size: 1.2rem; flex: none; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 650; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .done-tag { color: var(--gold); font-size: 0.8rem; margin-left: 4px; }
  .pbar { height: 7px; background: rgba(255,255,255,0.07); border-radius: 99px; margin: 5px 0 4px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 99px; transition: width 0.6s ease; }
  .pbar i.full { background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .sub { font-size: 0.76rem; color: var(--muted); }
  .sub b { color: var(--ink); }
  .cheer-btn { width: 40px; height: 40px; border-radius: 50%; font-size: 1.15rem; background: var(--panel); border: 1px solid var(--border); flex: none; }
  .cheer-btn:active { transform: scale(0.92); }
  .cheer-pick { display: flex; gap: 6px; justify-content: flex-end; padding: 0 6px 8px; animation: pop 0.15s ease-out; }
  .cheer-pick button { font-size: 1.4rem; width: 44px; height: 44px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .group-foot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* ── feed ── */
  .feed { list-style: none; }
  .feed .day { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 12px 0 6px; }
  .feed .day:first-child { margin-top: 0; }
  .ev { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .ev:last-child { border-bottom: none; }
  .ev .ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 1.05rem; background: var(--panel); flex: none; }
  .ev-goal .ico { background: rgba(251,191,36,0.15); }
  .ev-milestone .ico { background: rgba(34,211,238,0.12); }
  .ev-cheer .ico { background: rgba(251,113,133,0.13); }
  .ev .txt { font-size: 0.9rem; line-height: 1.35; }
  .ev .when { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
  .empty { text-align: center; padding: 22px 8px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
  .empty .big { font-size: 2.2rem; display: block; margin-bottom: 6px; }

  /* ── auth / setup ── */
  .hero { text-align: center; padding: 34px 6px 22px; }
  .hero .logo { font-size: 3.2rem; }
  .hero h1 { font-size: 2rem; font-weight: 850; letter-spacing: -1px; margin-top: 6px; }
  .hero h1 span { color: var(--accent); }
  .hero p { color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .auth-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .auth-links .btn { color: var(--muted); font-weight: 600; border-color: transparent; }

  /* ── forms & modal ── */
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .input {
    width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 1rem;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--ink); outline: none;
  }
  .input:focus { border-color: var(--accent); }
  .input.code { letter-spacing: 0.3em; text-align: center; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; }
  .emoji-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .emoji-row button { font-size: 1.3rem; width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); }

  dialog {
    margin: auto auto 0; width: 100%; max-width: 560px;
    max-height: 88vh; max-height: calc(100dvh - env(safe-area-inset-top) - 24px);
    background: var(--bg-2); color: var(--ink); border: 1px solid var(--border);
    border-radius: 22px 22px 0 0; padding: 0 18px calc(22px + env(safe-area-inset-bottom));
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  /* Freeze the page behind an open sheet so only the sheet scrolls. */
  body.modal-open { position: fixed; left: 0; right: 0; overflow: hidden; }
  @media (min-width: 600px) { dialog { margin: auto; border-radius: 22px; } }
  dialog::backdrop { background: rgba(3,6,15,0.65); backdrop-filter: blur(3px); }
  dialog h3 {
    font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 2; background: var(--bg-2);
    padding: 16px 0 12px; margin-bottom: 4px; border-bottom: 1px solid var(--border);
  }
  dialog h4 { font-size: 0.95rem; margin: 18px 0 8px; }
  .x { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); font-size: 1.3rem; color: var(--ink); line-height: 1; }
  details.manual { margin-top: 18px; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  details.manual summary { font-weight: 650; font-size: 0.9rem; cursor: pointer; }
  details.manual[open] summary { margin-bottom: 8px; }
  .big-steps { list-style: none; counter-reset: s; margin-top: 12px; }
  .big-steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; font-size: 0.9rem; line-height: 1.45; }
  .big-steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; display: grid; place-items: center; font-size: 0.85rem; }
  .big-steps .btn { margin-top: 8px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }
  .divider { height: 1px; background: var(--border); margin: 18px 0; }
  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-list .btn { justify-content: flex-start; }

  .steps-list { padding-left: 20px; font-size: 0.88rem; line-height: 1.5; }
  .steps-list li { margin-bottom: 9px; }
  .steps-list code, .kv code { background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 5px; font-size: 0.82rem; }
  .kv { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; padding: 8px 8px 8px 12px; margin-bottom: 8px; }
  .kv .k { font-size: 0.72rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .kv .v { font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; word-break: break-all; }
  .kv > div { flex: 1; min-width: 0; }
  .note { font-size: 0.8rem; color: var(--muted); background: rgba(34,211,238,0.07); border: 1px solid rgba(34,211,238,0.2); border-radius: 10px; padding: 10px 12px; line-height: 1.45; margin-top: 10px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 650; font-size: 0.9rem;
    opacity: 0; pointer-events: none; transition: all 0.25s ease; max-width: calc(100% - 32px); text-align: center; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .spinner { text-align: center; padding: 80px 0; color: var(--muted); }

  @media (max-width: 380px) {
    .ring-wrap { width: 112px; height: 112px; }
    .ring-center .num { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spinner">Lacing up…</div></div>
<div id="toast"></div>
<dialog id="modal"></dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const CFG = window.STEP_SQUAD_CONFIG || {};
const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo');
const CONFIGURED = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const CHEERS = ['👏', '🔥', '💪', '🎉', '🚀'];
const SHORTCUT_NAME = CFG.shortcutName || 'Sync Step Squad';
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const AVATARS = ['🚶', '🏃', '🏃‍♀️', '😎', '🌻', '🐕', '🦄', '🐢', '🦊', '⚡', '🌮', '👟'];

// ── small helpers ──────────────────────────────────────────────
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n || 0).toLocaleString();
const dayStr = (d = new Date()) => {
  const z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
};
const daysBack = n => { const d = new Date(); d.setDate(d.getDate() - n); return dayStr(d); };
function timeAgo(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
function store(key, val) {
  try { val == null ? localStorage.removeItem('ss.' + key) : localStorage.setItem('ss.' + key, val); } catch {}
}
function load(key) { try { return localStorage.getItem('ss.' + key); } catch { return null; } }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch { prompt('Copy this:', text); }
}

// ── backends: Supabase (real) and demo (in-memory) share one interface ──
function supabaseBackend() {
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  let uid = null;
  const must = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    async init() {
      const { data } = await sb.auth.getSession();
      uid = data.session?.user?.id || null;
      return uid;
    },
    onAuth(cb, onRecovery) {
      sb.auth.onAuthStateChange((event, session) => {
        // Reset-password links sign you in, then ask for a new password.
        if (event === 'PASSWORD_RECOVERY') { uid = session?.user?.id || null; return onRecovery(); }
        const next = session?.user?.id || null;
        if (next !== uid) { uid = next; cb(uid); }
      });
    },
    async signIn(email, password) { must(await sb.auth.signInWithPassword({ email, password })); },
    // Returns true when signed in right away, false when the email needs confirming first.
    async signUp(email, password, name) {
      const data = must(await sb.auth.signUp({
        email, password,
        options: { data: { display_name: name }, emailRedirectTo: location.origin + location.pathname },
      }));
      if (data.user && !data.user.identities?.length) throw new Error('That email already has an account — try signing in.');
      return !!data.session;
    },
    async resetPassword(email) {
      must(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }));
    },
    async setPassword(password) { must(await sb.auth.updateUser({ password })); },
    async signOut() { await sb.auth.signOut(); },
    async profile() { return must(await sb.from('profiles').select('*').eq('id', uid).single()); },
    async updateProfile(fields) { must(await sb.from('profiles').update(fields).eq('id', uid)); },
    async groups() { return must(await sb.from('groups').select('*').order('created_at')); },
    async createGroup(name) { return must(await sb.rpc('create_group', { p_name: name })); },
    async joinGroup(code) { return must(await sb.rpc('join_group', { p_code: code })); },
    async leaveGroup(id) { must(await sb.rpc('leave_group', { p_group: id })); },
    async members(groupId) {
      const rows = must(await sb.from('group_members').select('user_id').eq('group_id', groupId));
      if (!rows.length) return [];
      return must(await sb.from('profiles').select('*').in('id', rows.map(r => r.user_id)));
    },
    async steps(ids, sinceDay) {
      return must(await sb.from('daily_steps').select('user_id, day, steps, updated_at').in('user_id', ids).gte('day', sinceDay));
    },
    async feed(ids) {
      return must(await sb.from('feed_events').select('*').in('user_id', ids).order('created_at', { ascending: false }).order('id', { ascending: false }).limit(60));
    },
    async cheer(target, emoji) { must(await sb.rpc('send_cheer', { p_target: target, p_emoji: emoji })); },
    async logSteps(steps, day) { must(await sb.rpc('log_my_steps', { p_steps: steps, p_day: day })); },
    async token() { return must(await sb.rpc('get_my_token')); },
    async rotateToken() { return must(await sb.rpc('rotate_my_token')); },
    async setTimeZone(tz) { must(await sb.rpc('set_my_time_zone', { p_tz: tz })); },
    subscribe(cb) {
      sb.channel('squad')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'feed_events' }, cb)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_steps' }, cb)
        .subscribe();
    },
    shortcut: { url: CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/rpc/submit_steps', key: CFG.supabaseAnonKey },
  };
}

function demoBackend() {
  const ME = 'me';
  const today = dayStr();
  const now = Date.now();
  const people = {
    me:     { id: ME,       display_name: 'Alex',    emoji: '😎', daily_goal: 10000 },
    mom:    { id: 'mom',    display_name: 'Mom',     emoji: '🌻', daily_goal: 8000 },
    dad:    { id: 'dad',    display_name: 'Dad',     emoji: '🧔', daily_goal: 10000 },
    katie:  { id: 'katie',  display_name: 'Katie',   emoji: '🏃‍♀️', daily_goal: 12000 },
    gramps: { id: 'gramps', display_name: 'Grandpa', emoji: '👴', daily_goal: 5000 },
    sam:    { id: 'sam',    display_name: 'Sam',     emoji: '🐕', daily_goal: 10000 },
    priya:  { id: 'priya',  display_name: 'Priya',   emoji: '🚴‍♀️', daily_goal: 9000 },
  };
  const groups = [
    { id: 'fam', name: 'Ruhlin Fam', invite_code: 'FAM5K7', created_by: ME, members: [ME, 'mom', 'dad', 'katie', 'gramps'] },
    { id: 'work', name: 'Lunch Walkers', invite_code: 'WLK8RS', created_by: 'priya', members: [ME, 'sam', 'priya'] },
  ];
  const steps = {};   // `${uid}|${day}` → { steps, updated_at }
  const feed = [];
  let nextId = 1;
  const listeners = [];
  const emit = () => listeners.forEach(fn => fn());

  // Mirrors _record_steps in schema.sql.
  function record(uid, total, day, at = new Date().toISOString()) {
    const key = `${uid}|${day}`;
    const prev = steps[key]?.steps || 0;
    steps[key] = { steps: total, updated_at: at };
    if (total <= prev) return;
    const goal = people[uid].daily_goal;
    const push = e => feed.push({ id: nextId++, user_id: uid, day, created_at: at, ...e });
    if (total - prev >= 250) push({ kind: 'progress', steps: total, delta: total - prev });
    for (let m = 5000; m <= 50000; m += 5000) {
      if (prev < m && total >= m && m !== goal) push({ kind: 'milestone', steps: m });
    }
    if (prev < goal && total >= goal) push({ kind: 'goal', steps: goal });
  }

  // Seed: last week's totals, then today's syncs spread across the day so far.
  const hoursAwake = Math.max(0.5, Math.min(14, (new Date().getHours() + new Date().getMinutes() / 60) - 7));
  const dayFrac = hoursAwake / 14;
  for (const p of Object.values(people)) {
    for (let d = 1; d <= 6; d++) {
      steps[`${p.id}|${daysBack(d)}`] = { steps: Math.round(p.daily_goal * (0.6 + Math.random() * 0.7)), updated_at: new Date(now - d * 864e5).toISOString() };
    }
    if (p.id === ME) continue;
    const target = Math.round(p.daily_goal * (0.5 + Math.random() * 0.9) * dayFrac);
    const syncs = 2 + Math.floor(Math.random() * 4);
    for (let i = 1; i <= syncs; i++) {
      const at = new Date(now - (hoursAwake * 36e5) * (1 - i / (syncs + 0.3))).toISOString();
      record(p.id, Math.round(target * i / syncs), today, at);
    }
  }
  record(ME, Math.round(10000 * 0.75 * dayFrac), today, new Date(now - 40 * 6e4).toISOString());
  feed.push({ id: nextId++, user_id: 'mom', kind: 'cheer', target_user: ME, emoji: '💪', day: today, created_at: new Date(now - 25 * 6e4).toISOString() });
  feed.push({ id: nextId++, user_id: 'katie', kind: 'cheer', target_user: 'gramps', emoji: '🎉', day: today, created_at: new Date(now - 12 * 6e4).toISOString() });

  // Someone in the squad goes for a little walk every few seconds.
  setInterval(() => {
    const ids = Object.keys(people).filter(id => id !== ME);
    const uid = ids[Math.floor(Math.random() * ids.length)];
    const cur = steps[`${uid}|${today}`]?.steps || 0;
    if (Math.random() < 0.25) {
      feed.push({ id: nextId++, user_id: uid, kind: 'cheer', target_user: ME, emoji: CHEERS[Math.floor(Math.random() * CHEERS.length)], day: today, created_at: new Date().toISOString() });
    } else {
      record(uid, cur + 300 + Math.floor(Math.random() * 1800), today);
    }
    emit();
  }, 9000);

  const memberOf = gid => groups.find(g => g.id === gid)?.members || [];
  const strip = g => ({ id: g.id, name: g.name, invite_code: g.invite_code, created_by: g.created_by });
  const later = v => new Promise(r => setTimeout(() => r(v), 60));
  return {
    async init() { return ME; },
    async signOut() { location.href = location.pathname; },
    async profile() { return { ...people.me }; },
    async updateProfile(f) { Object.assign(people.me, f); },
    async groups() { return later(groups.filter(g => g.members.includes(ME)).map(strip)); },
    async createGroup(name) {
      const g = { id: 'g' + Date.now(), name, invite_code: Math.random().toString(36).slice(2, 8).toUpperCase(), created_by: ME, members: [ME] };
      groups.push(g);
      return strip(g);
    },
    async joinGroup(code) {
      const g = groups.find(x => x.invite_code === code.trim().toUpperCase());
      if (!g) throw new Error('No group with that invite code (try FAM5K7 in the demo)');
      if (!g.members.includes(ME)) g.members.push(ME);
      return strip(g);
    },
    async leaveGroup(id) { const g = groups.find(x => x.id === id); g.members = g.members.filter(m => m !== ME); },
    async members(gid) { return later(memberOf(gid).map(id => ({ ...people[id] }))); },
    async steps(ids, since) {
      return Object.entries(steps)
        .map(([k, v]) => { const [user_id, day] = k.split('|'); return { user_id, day, ...v }; })
        .filter(r => ids.includes(r.user_id) && r.day >= since);
    },
    async feed(ids) {
      return feed.filter(e => ids.includes(e.user_id)).sort((a, b) => b.created_at.localeCompare(a.created_at) || b.id - a.id).slice(0, 60);
    },
    async cheer(target, emoji) {
      feed.push({ id: nextId++, user_id: ME, kind: 'cheer', target_user: target, emoji, day: today, created_at: new Date().toISOString() });
      emit();
    },
    async logSteps(n, day) { record(ME, n, day); emit(); },
    async token() { return 'demo-7f3a9c2e1b8d4f60a5e2'; },
    async rotateToken() { return 'demo-' + Math.random().toString(16).slice(2, 22); },
    async setTimeZone() {},
    subscribe(cb) { listeners.push(cb); },
    shortcut: { url: 'https://YOUR-PROJECT.supabase.co/rest/v1/rpc/submit_steps', key: 'your-anon-key' },
  };
}

const state = {

  profile: null,
  groups: [],
  groupId: load('groupId'),
  members: [],
  steps: [],
  feed: [],
  view: 'today',
  cheerFor: null,
  entered: false,
};
const app = $('#app');

const stepsOn = (uid, day) => state.steps.find(r => r.user_id === uid && r.day === day)?.steps || 0;
const syncedAt = uid => state.steps.find(r => r.user_id === uid && r.day === dayStr())?.updated_at;
const weekSum = uid => state.steps.filter(r => r.user_id === uid).reduce((s, r) => s + r.steps, 0);
const nameOf = uid => uid === state.uid ? 'You' : (state.members.find(m => m.id === uid)?.display_name || 'Someone');
const activeGroup = () => state.groups.find(g => g.id === state.groupId);

function streak() {
  const goal = state.profile.daily_goal;
  let n = 0;
  // Today counts once it's done; otherwise the streak runs through yesterday.
  for (let d = stepsOn(state.uid, dayStr()) >= goal ? 0 : 1; d <= 6; d++) {
    if (stepsOn(state.uid, daysBack(d)) >= goal) n++; else break;
  }
  return n;
}

// ── boot & data ───────────────────────────────────────────────
async function boot() {
  if (!api) return renderSetup();
  const join = qs.get('join');
  if (join) store('pendingJoin', join);
  // Reset-password links arrive as #…type=recovery; Supabase consumes the hash during init.
  const recovering = location.hash.includes('type=recovery');
  state.uid = await api.init();
  if (state.uid && recovering) renderNewPassword();
  else state.uid ? enter() : renderAuth();
  api.onAuth?.(uid => { state.uid = uid; uid ? enter() : renderAuth(); }, renderNewPassword);
}

async function enter() {
  try {
    state.profile = await api.profile();
  } catch (e) {
    app.innerHTML = `<div class="panel empty">Couldn't load your profile: ${esc(e.message)}<br>Did you run <code>schema.sql</code> in Supabase?</div>`;
    return;
  }
  // The Shortcut only sends a step count, so the server needs to know whose "today" it is.
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (tz && state.profile.time_zone !== tz) {
    api.setTimeZone(tz).then(() => { state.profile.time_zone = tz; }).catch(() => {});
  }
  const pending = load('pendingJoin');
  if (pending) {
    store('pendingJoin', null);
    history.replaceState(null, '', location.pathname + (DEMO ? '?demo=1' : ''));
    try {
      const g = await api.joinGroup(pending);
      state.groupId = g.id;
      toast(`You joined ${g.name}! 🎉`);
    } catch (e) { toast(e.message); }
  }
  await refresh();
  if (!state.entered) {
    state.entered = true;
    api.subscribe(debounce(refresh, 400));
    setInterval(refresh, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  }
  if (!load('onboarded') && !syncedAt(state.uid)) { store('onboarded', '1'); openSyncSetup(); }
}

let refreshing = null, again = false;
async function refresh() {
  if (!state.uid) return;
  if (refreshing) { again = true; return refreshing; }
  refreshing = (async () => {
    try {
      state.groups = await api.groups();
      if (!activeGroup()) state.groupId = state.groups[0]?.id || null;
      store('groupId', state.groupId);
      state.members = state.groupId ? await api.members(state.groupId) : [state.profile];
      const ids = state.members.map(m => m.id);
      [state.steps, state.feed] = await Promise.all([
        api.steps(ids, daysBack(6)),
        state.groupId ? api.feed(ids) : Promise.resolve([]),
      ]);
      renderApp();
    } catch (e) {
      toast('Sync problem: ' + e.message);
    }
  })();
  await refreshing;
  refreshing = null;
  if (again) { again = false; return refresh(); }
}

function ring(steps, goal) {
  const r = 52, c = 2 * Math.PI * r, p = Math.min(1, steps / goal);
  return `<svg class="ring ${steps >= goal ? 'done' : ''}" viewBox="0 0 120 120" aria-hidden="true">
    <circle class="track" cx="60" cy="60" r="${r}"/>
    <circle class="bar" cx="60" cy="60" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 60 60)"/>
  </svg>`;
}

function pepTalk(mine, goal) {
  const left = goal - mine;
  if (mine === 0) return 'Lace up — the squad is waiting.';
  if (left <= 0) return 'Goal crushed! 🎉 Every extra step is a flex.';
  if (mine < goal / 2) return `${fmt(goal / 2 - mine)} steps to halfway. You've got this.`;
  if (left < 1500) return `So close — just ${fmt(left)} to go!`;
  return `Past halfway! ${fmt(left)} to go.`;
}

function renderApp() {

    if (myRank > 0 && stepsOn(ranked[myRank - 1], today) === mine) rankLine = `Tied with ${esc(nameOf(ranked[myRank - 1]))} in ${esc(g.name)} — break it!`;

function renderGroup(g) {
  const today = dayStr();
  const isToday = state.view === 'today';
  const ids = new Set(state.members.map(m => m.id));
  const rows = state.members
    .map(m => ({ m, n: isToday ? stepsOn(m.id, today) : weekSum(m.id) }))
    .sort((a, b) => b.n - a.n);
  const top = Math.max(1, ...rows.map(r => r.n));
  const medals = ['🥇', '🥈', '🥉'];

  const board = rows.map(({ m, n }, i) => {
    const isMe = m.id === state.uid;
    const pct = isToday ? Math.min(100, n / m.daily_goal * 100) : n / top * 100;
    const done = isToday && n >= m.daily_goal;
    const synced = syncedAt(m.id);
    return `
      <div class="row ${isMe ? 'me' : ''}">
        <div class="rank">${n > 0 && i < 3 ? medals[i] : i + 1}</div>
        <div class="av">${esc(m.emoji)}</div>
        <div class="info">
          <div class="name">${esc(m.display_name)}${isMe ? ' <span class="muted small">(you)</span>' : ''}${done ? '<span class="done-tag">✓ goal</span>' : ''}</div>
          <div class="pbar"><i class="${done ? 'full' : ''}" style="width:${pct}%"></i></div>
          <div class="sub"><b>${fmt(n)}</b> ${isToday ? `/ ${fmt(m.daily_goal)}` : 'this week'}${isToday && synced ? ` · ${timeAgo(synced)}` : ''}</div>
        </div>
        ${isMe ? '' : `<button class="cheer-btn" data-act="cheer-open" data-id="${esc(m.id)}" aria-label="Cheer ${esc(m.display_name)}">👏</button>`}
      </div>
      ${state.cheerFor === m.id ? `<div class="cheer-pick">${CHEERS.map(e => `<button data-act="cheer" data-id="${esc(m.id)}" data-e="${e}">${e}</button>`).join('')}</div>` : ''}`;
  }).join('');

  // Only show cheers between people who are both in this group.
  const events = state.feed.filter(e => e.kind !== 'cheer' || ids.has(e.target_user));
  let lastDay = null;
  const feedHtml = events.map(e => {
    let head = '';
    if (e.day !== lastDay) {
      lastDay = e.day;
      head = `<li class="day">${e.day === today ? 'Today' : e.day === daysBack(1) ? 'Yesterday' : new Date(e.day + 'T12:00').toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}</li>`;
    }
    return head + feedItem(e);
  }).join('');

  return `
    <section class="panel">
      <div class="panel-head">
        <h2>${esc(g.name)}</h2>
        <div class="seg">
          <button class="${isToday ? 'on' : ''}" data-act="view" data-v="today">Today</button>
          <button class="${isToday ? '' : 'on'}" data-act="view" data-v="week">7 days</button>
        </div>
      </div>
      <div class="board">${board}</div>
      <div class="group-foot">
        <button class="btn sm" data-act="invite">📨 Invite · <b>${esc(g.invite_code)}</b></button>
        <button class="btn sm ghost danger" data-act="leave">Leave</button>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Squad feed</h2><span class="muted small">live</span></div>
      ${feedHtml ? `<ul class="feed">${feedHtml}</ul>` : `<div class="empty"><span class="big">🌅</span>Nothing yet today. Be the first to sync!</div>`}
    </section>`;
}

function feedItem(e) {
  const who = `<b>${esc(nameOf(e.user_id))}</b>`;
  const av = state.members.find(m => m.id === e.user_id)?.emoji || '🚶';
  let ico, txt;
  switch (e.kind) {
    case 'progress':
      ico = esc(av);
      txt = `${who} added <b>${fmt(e.delta)}</b> steps <span class="muted">· ${fmt(e.steps)} today</span>`;
      break;
    case 'milestone':
      ico = '🏅';
      txt = `${who} passed <b>${fmt(e.steps)}</b> steps`;
      break;
    case 'goal':
      ico = '🎯';
      txt = `${who} hit ${e.user_id === state.uid ? 'your' : 'their'} daily goal of <b>${fmt(e.steps)}</b>!`;
      break;
    case 'cheer':
      ico = esc(e.emoji);
      txt = `${who} cheered <b>${e.target_user === state.uid ? 'you' : esc(nameOf(e.target_user))}</b> on`;
      break;
    default:
      return '';
  }
  return `<li class="ev ev-${e.kind}"><span class="ico">${ico}</span><div><div class="txt">${txt}</div><div class="when">${timeAgo(e.created_at)}</div></div></li>`;
}

// ── modal ─────────────────────────────────────────────────────
const modal = $('#modal');
function openModal(title, body, onSubmit) {
  modal.innerHTML = `<form method="dialog"><h3>${title}<button type="button" class="x" data-close aria-label="Close">×</button></h3>${body}</form>`;
  const form = modal.querySelector('form');
  form.addEventListener('submit', async e => {
    if (!onSubmit) return;
    e.preventDefault();
    const btn = form.querySelector('button.primary');
    if (btn) btn.disabled = true;
    try {
      if (await onSubmit(form) !== false) modal.close();
    } catch (err) {
      toast(err.message);
    } finally {
      if (btn) btn.disabled = false;
    }
  });
  if (!modal.open) {
    lockScroll(true);
    modal.showModal();
  }
  modal.scrollTop = 0;
}
function lockScroll(on) {
  if (on) {
    lockScroll.y = window.scrollY;
    document.body.style.top = `-${lockScroll.y}px`;
    document.body.classList.add('modal-open');
  } else if (document.body.classList.contains('modal-open')) {
    document.body.classList.remove('modal-open');
    document.body.style.top = '';
    window.scrollTo(0, lockScroll.y || 0);
  }
}
modal.addEventListener('close', () => lockScroll(false));
modal.addEventListener('click', e => {
  if (e.target === modal || e.target.closest('[data-close]')) modal.close();
  const c = e.target.closest('[data-copy]');
  if (c) copy(c.dataset.copy);
  // Copy the token, then let the link open the Shortcut in the Shortcuts app.
  const add = e.target.closest('[data-add-shortcut]');
  if (add) copy(add.dataset.addShortcut);
  const em = e.target.closest('[data-emoji]');
  if (em) { modal.querySelector('[name=emoji]').value = em.dataset.emoji; }
});

  openModal('Join a squad', `
    <label class="field"><span>Invite code</span><input class="input code" name="code" maxlength="6" placeholder="ABC123" autocapitalize="characters" required></label>
    <div class="modal-actions"><button class="btn primary">Join</button></div>`,
    async f => {
      const g = await api.joinGroup(f.code.value);
      state.groupId = g.id;
      await refresh();
      toast(`Welcome to ${g.name}! 🎉`);
    });
}

function openNewOrJoin() {
  openModal('Squads', `
    <div class="menu-list">
      <button type="button" class="btn" data-act="create">➕ Create a new squad</button>
      <button type="button" class="btn" data-act="join">🔑 Join with an invite code</button>
    </div>`);
}

function openLog() {
  openModal('Log steps', `
    <p class="small muted" style="margin-bottom:12px">Enter your <b>total</b> for the day — handy before your Shortcut is set up, or if you forgot your phone.</p>
    <label class="field"><span>Day</span><input class="input" type="date" name="day" value="${dayStr()}" min="${daysBack(6)}" max="${dayStr()}" required></label>
    <label class="field"><span>Total steps</span><input class="input" name="steps" type="number" inputmode="numeric" min="0" max="200000" value="${stepsOn(state.uid, dayStr()) || ''}" required></label>
    <div class="modal-actions"><button class="btn primary">Save</button></div>`,
    async f => {
      await api.logSteps(parseInt(f.steps.value, 10), f.day.value);
      await refresh();
      toast('Steps saved 👟');
    });
}

function openSettings() {
  const p = state.profile;
  openModal('You', `
    <label class="field"><span>Display name</span><input class="input" name="display_name" maxlength="40" value="${esc(p.display_name)}" required></label>
    <label class="field"><span>Avatar</span><input class="input" name="emoji" maxlength="8" value="${esc(p.emoji)}" required>
      <div class="emoji-row">${AVATARS.map(a => `<button type="button" data-emoji="${a}">${a}</button>`).join('')}</div></label>
    <label class="field"><span>Daily step goal</span><input class="input" name="daily_goal" type="number" inputmode="numeric" min="500" max="100000" step="500" value="${p.daily_goal}" required></label>
    <div class="modal-actions"><button class="btn primary">Save</button></div>
    <div class="divider"></div>
    <div class="menu-list">
      <button type="button" class="btn" data-act="sync">🍎 Apple Health sync setup</button>
      <button type="button" class="btn" data-act="log">✏️ Log steps manually</button>
      <button type="button" class="btn danger" data-act="signout">Sign out</button>
    </div>`,
    async f => {
      const fields = { display_name: f.display_name.value.trim(), emoji: f.emoji.value.trim(), daily_goal: parseInt(f.daily_goal.value, 10) };
      await api.updateProfile(fields);
      Object.assign(state.profile, fields);
      await refresh();
      toast('Saved');
    });
}

async function openSyncSetup() {
  const { url, key } = api.shortcut;
  const shared = CFG.shortcutUrl || (DEMO ? 'https://www.icloud.com/shortcuts/demo' : '');
  let token = '…';
  try { token = await api.token(); } catch (e) { toast(e.message); }
  const kv = (k, v) => `<div class="kv"><div><div class="k">${k}</div><div class="v">${esc(v)}</div></div><button type="button" class="btn sm" data-copy="${esc(v)}">Copy</button></div>`;
  const manual = `
    <h4>Your connection details</h4>
    ${kv('URL', url)}
    ${kv('apikey header', key)}
    ${kv('Your secret token', token)}

    <h4>Build the Shortcut</h4>
    <ol class="steps-list">
      <li>Open the <b>Shortcuts</b> app → <b>＋</b> → name it <code>Sync Step Squad</code>.</li>
      <li>Add <b>Find Health Samples</b>: <i>Type</i> is <code>Steps</code>, <i>Start Date</i> is <code>Today</code>. Set <i>Group By</i> to <code>Day</code>.</li>
      <li>Add <b>Calculate Statistics</b> → <code>Sum</code> of <i>Health Samples</i>.</li>
      <li>Add <b>Get Contents of URL</b> with the URL above. Tap <i>Show More</i>:
        <br>• Method: <code>POST</code>
        <br>• Headers: <code>apikey</code> = the key above
        <br>• Request Body: <code>JSON</code> with two fields:
        <br>&nbsp;&nbsp;<code>p_token</code> (Text) = your secret token
        <br>&nbsp;&nbsp;<code>p_steps</code> (Number) = <i>Statistics</i></li>
      <li>Tap ▶︎ to run it once. Allow Health access when asked. Your steps should appear here.</li>
    </ol>`;
  openModal('🍎 Apple Health sync', `
    <p class="small muted" style="line-height:1.5;margin-top:10px">Apple Health doesn't share data with websites, so a <b style="color:var(--ink)">Shortcut</b> on your iPhone reads your steps and sends them here.</p>

    ${shared ? `
      <ol class="big-steps">
        <li><div>Tap below. It copies your secret token and opens the Shortcut.
          <br><a class="btn primary" href="${esc(shared)}" target="_blank" rel="noopener" data-add-shortcut="${esc(token)}">＋ Add the Shortcut</a></div></li>
        <li><div>In Shortcuts, tap <b>Set Up Shortcut</b>. When it asks for your token, tap the box and <b>Paste</b>, then <b>Add Shortcut</b>.</div></li>
        <li><div>Tap the new <b>Sync Step Squad</b> shortcut once and allow Health access. Your steps show up here.</div></li>
      </ol>
      ${kv('Your secret token', token)}` : manual}

    <h4>Make it automatic</h4>
    <ol class="steps-list">
      <li>Shortcuts → <b>Automation</b> → <b>＋</b> → <b>Time of Day</b>. Pick a time, choose <b>Run Immediately</b>, and select <code>Sync Step Squad</code>.</li>
      <li>Repeat for a few times through the day (e.g. 10am, 1pm, 4pm, 7pm, 9:30pm).</li>
      <li>Bonus: an <b>App</b> automation ("when Instagram is opened") syncs every time you open an app you use a lot.</li>
    </ol>
    <div class="note">💡 iPhones lock Health data while the phone is locked, so a sync that runs then may be skipped. Syncs triggered while you're using your phone work best. Compare with the Health app the first time. If you also wear an Apple Watch and the number is too high, change the filter to also require <i>Source</i> is your iPhone.</div>

    ${shared ? `<details class="manual"><summary>Build the Shortcut yourself instead</summary>${manual}</details>` : ''}

    <div class="divider"></div>
    <button type="button" class="btn sm ghost danger" data-act="rotate">Reset my token</button>
    <p class="small muted" style="margin-top:6px">Do this if you shared your token by accident. You'll need to paste the new one into your Shortcut.</p>
    <div class="modal-actions"><button type="button" class="btn primary" data-close>Done</button></div>
  `);
}

async function share(g) {
  const link = `${location.origin}${location.pathname}?join=${g.invite_code}${DEMO ? '&demo=1' : ''}`;
  const text = `Join my squad "${g.name}" on Step Squad and let's keep each other moving! 👟 Invite code: ${g.invite_code}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Step Squad', text, url: link }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  copy(`${text}\n${link}`);
}

// ── actions ───────────────────────────────────────────────────
document.addEventListener('click', async e => {
  if (e.target.closest('[data-sync-now]')) {
    toast('Running your Shortcut… tap ◀ Step Squad to come back');
    setTimeout(refresh, 4000);
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;
  try {
    switch (act) {
      case 'settings': return openSettings();
      case 'sync': return openSyncSetup();
      case 'log': return openLog();
      case 'new-group': return openNewOrJoin();
      case 'create': return openCreate();
      case 'join': return openJoin();
      case 'auth-mode': return renderAuth(el.dataset.mode);
      case 'group':
        state.groupId = id; state.cheerFor = null;
        store('groupId', id);
        return refresh();
      case 'view':
        state.view = el.dataset.v;
        return renderApp();
      case 'invite': return share(activeGroup());
      case 'leave': {
        const g = activeGroup();
        if (!confirm(`Leave ${g.name}? You can rejoin with the code ${g.invite_code}.`)) return;
        await api.leaveGroup(g.id);
        state.groupId = null;
        return refresh();
      }
      case 'cheer-open':
        state.cheerFor = state.cheerFor === id ? null : id;
        return renderApp();
      case 'cheer':
        state.cheerFor = null;
        await api.cheer(id, el.dataset.e);
        toast(`${el.dataset.e} Sent to ${nameOf(id)}!`);
        return refresh();
      case 'rotate': {
        if (!confirm('Reset your token? Your Shortcut will stop working until you paste in the new one.')) return;
        await api.rotateToken();
        return openSyncSetup();
      }
      case 'signout':
        modal.close();
        state.uid = null;
        await api.signOut();
        return renderAuth();
    }
  } catch (err) {
    toast(err.message);
  }
});

boot();
</script>
</body>
</html>
